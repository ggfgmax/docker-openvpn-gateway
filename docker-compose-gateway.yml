version: "3.8"

services:
  openvpn-gateway:
    build: .
    image: openvpn-gateway:latest
    container_name: openvpn-gateway
    ports:
      - "1194:1194/udp"
      # WireGuard 端口范围（根据需要添加站点时调整）
      - "51820-51830:51820-51830/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE  # WireGuard 需要
    sysctls:
      # IP 转发（Site-to-Site VPN 必需）
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - openvpn-gateway-data:/etc/openvpn
      # WireGuard 内核模块（如果宿主机支持）
      - /lib/modules:/lib/modules:ro
    devices:
      # 允许访问 TUN/TAP 设备
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    environment:
      # 模式设置: 0=普通VPN, 1=网关模式
      - GATEWAY_MODE=${GATEWAY_MODE:-0}
      # LDAP 设置: 0=禁用, 1=启用
      - LDAP_ENABLED=${LDAP_ENABLED:-0}
      # 调试模式
      - DEBUG=${DEBUG:-0}
    networks:
      - vpn-network

volumes:
  openvpn-gateway-data:
    driver: local

networks:
  vpn-network:
    driver: bridge
